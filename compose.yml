services:
  unsloth:
    build: .
    # `docker compose pull` fetches the CI-built image; `docker compose build` rebuilds locally
    image: ghcr.io/selfref/unsloth-docker-amd:latest
    ports:
      - "8000:8000"
    devices:
      - /dev/kfd   # ROCm compute (omit if the GPU is Vulkan-only)
      - /dev/dri   # GPU render nodes (needed by both ROCm and Vulkan)
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    ipc: host
    volumes:
      - ./work:/workspace
      # Hugging Face cache (models/datasets) — HF_HOME points here
      - ./huggingface:/workspace/.cache/huggingface
      # Studio state (accounts/password, chat history, download cache, datasets,
      # outputs, runs, llama.cpp builds) — survives container recreation and
      # image upgrades (the Python venv stays in the image, see Dockerfile).
      - unsloth-studio:/opt/studio-data
    environment:
      # Uncomment/adjust for your GPU — see README.md
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"   # e.g. RX 7000 series (gfx1100/01/02)
      # UNSLOTH_FORCE_VULKAN: "1"            # use Vulkan llama.cpp backend
      HF_TOKEN: "${HF_TOKEN:-}"
      # Initial admin ("unsloth") password. Applied on the first start only; the
      # entrypoint ignores it once a password is set (change it in the UI, or
      # `unsloth studio reset-password`). Leave empty to use the generated
      # bootstrap password printed in the logs.
      UNSLOTH_STUDIO_PASSWORD: "${UNSLOTH_STUDIO_PASSWORD:-}"
      # Set when a reverse proxy in front sets X-Forwarded-For (login rate limiting).
      # UNSLOTH_STUDIO_TRUST_FORWARDED: "1"
    stdin_open: true
    tty: true

volumes:
  unsloth-studio:
