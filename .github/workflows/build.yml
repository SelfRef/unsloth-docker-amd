name: Build image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  schedule:
    # Weekly rebuild to pick up new unsloth / bitsandbytes releases
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Full build takes a long time (20 GB ROCm base + torch wheels)
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # GHCR requires lowercase names; github.repository may contain uppercase
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The final image is ~36 GB; stock runners have ~20 GB free. Removing
      # preinstalled toolchains frees ~30+ GB more.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show free disk
        run: df -h /

      - name: Lint Dockerfile
        run: docker build --check .

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin the newest Unsloth release explicitly: reproducible builds, and the
      # version shows up as an image tag/label instead of "whatever pip picked".
      - name: Resolve latest Unsloth version
        id: unsloth
        run: |
          version=$(curl -fsSL https://pypi.org/pypi/unsloth/json | jq -r .info.version)
          test -n "$version" && test "$version" != null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "unsloth $version"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=unsloth-${{ steps.unsloth.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=unsloth-amd
            org.opencontainers.image.description=Unsloth for AMD GPUs (ROCm + Vulkan)
            dev.selfref.unsloth.version=${{ steps.unsloth.outputs.version }}

      # Always a CLEAN build — no registry layer cache. Importing the ~6 GB torch
      # layer from a GHCR `:buildcache` trips GHCR's burst limiter ("429 Too Many
      # Requests", retry-after in the tens of ms) and BuildKit does not retry a
      # 429, so cached builds failed 8 out of 8 attempts on 2026-08-30. A clean
      # build takes ~15-20 min (ROCm base from Docker Hub, torch wheels from
      # pytorch.org, neither throttles like that) and is deterministic. The GHA
      # cache (10 GB cap) is too small to be an alternative.
      #
      # Plain `docker buildx build` in a short retry loop instead of
      # build-push-action, so a transient registry/PyPI hiccup does not fail the
      # weekly run.
      - name: Build and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PUSH: ${{ github.event_name != 'pull_request' }}
          UNSLOTH_VERSION: ${{ steps.unsloth.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag;   do [ -n "$tag" ]   && args+=(--tag "$tag");     done <<< "$TAGS"
          while IFS= read -r label; do [ -n "$label" ] && args+=(--label "$label"); done <<< "$LABELS"
          [ "$PUSH" = true ] && args+=(--push)
          for attempt in 1 2 3; do
            if docker buildx build --platform linux/amd64 \
                 --build-arg "UNSLOTH_VERSION=${UNSLOTH_VERSION}" \
                 "${args[@]}" . ; then
              exit 0
            fi
            echo "::warning::build attempt ${attempt} failed; retrying in 120 s"
            sleep 120
          done
          echo "::error::build failed after 3 attempts"
          exit 1
